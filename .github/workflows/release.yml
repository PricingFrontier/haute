name: Release

# Publishes the version pyproject.toml declares on main to PyPI, then tags it.
#
# Releasing: bump [project] version in a pull request (`uv version --bump patch`,
# `--bump minor` or `--bump major`), merge it, wait for main's CI to pass, then
# run this workflow from the Actions tab (Release -> Run workflow, on main). It
# never edits or commits to the repository, and it refuses a version PyPI
# already has, so an unbumped main cannot be released twice. Tick "dry run" to
# build and smoke-check without publishing. If a run fails after publishing
# started, use "Re-run failed jobs": the upload skips files PyPI already has, and
# the tag is created only once PyPI serves exactly this run's files.
#
# One-time setup, before adding the publisher:
# 1. GitHub: Settings -> Environments -> `pypi` -> Deployment branches and tags
#    -> Selected branches and tags -> add the branch rule `main`. PyPI's
#    trusted publisher cannot restrict the branch, so this rule is what stops a
#    copy of this workflow on another branch from publishing.
# 2. PyPI: the haute project -> Publishing -> add a GitHub publisher (owner
#    PricingFrontier, repository haute, workflow release.yml, environment pypi).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and smoke-check only, publish nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check the version and main's CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Release from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run Release on main; this run is on ${GITHUB_REF}."
          exit 1

      - name: Require main's CI to have passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --event push --commit "$GITHUB_SHA" --limit 1 --json status,conclusion,url \
            --jq '.[0] | select(. != null) | "\(.status)|\(.conclusion)|\(.url)"')
          if [ -z "$run" ]; then
            echo "::error::No CI run on main for ${GITHUB_SHA}; release a commit main's CI has checked."
            exit 1
          fi
          # A running job has an empty conclusion, so split on a separator that
          # keeps empty fields rather than on whitespace.
          IFS='|' read -r status conclusion url <<< "$run"
          if [ "$status" != "completed" ]; then
            echo "::error::main's CI is still running for this commit ($url); run Release when it finishes."
            exit 1
          fi
          if [ "$conclusion" != "success" ]; then
            echo "::error::main's CI finished '$conclusion' for this commit ($url); fix main before releasing."
            exit 1
          fi
          echo "main's CI passed for ${GITHUB_SHA}: $url"

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.22"
          python-version: "3.12"

      - name: Refuse a version PyPI already has
        id: version
        run: |
          status=$(curl -sS -o pypi.json -w '%{http_code}' https://pypi.org/pypi/haute/json)
          case "$status" in
            200) pypi=(--pypi-json pypi.json) ;;
            404) pypi=() ;;
            *)
              echo "::error::PyPI answered HTTP $status for haute; run Release again later."
              exit 1
              ;;
          esac
          uv run --no-project python scripts/check_release_version.py "${pypi[@]}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Refuse a version that is already tagged
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # --exit-code exits 2 only when no tag matches; any other failure of the
          # lookup must not read as "untagged".
          lookup=0
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null || lookup=$?
          case "$lookup" in
            2) echo "v$VERSION is not tagged yet." ;;
            0)
              echo "::error::Tag v$VERSION already exists. Bump [project] version in pyproject.toml in a pull request."
              exit 1
              ;;
            *)
              echo "::error::Could not look up tag v$VERSION (git ls-remote exited $lookup); run Release again."
              exit 1
              ;;
          esac

  build:
    name: Build and smoke-check
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.22"
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - run: HAUTE_BUILD_FRONTEND=1 uv build --out-dir dist --sdist --wheel

      - name: Check the files carry the version
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          ls -l dist
          test -f "dist/haute-${VERSION}-py3-none-any.whl"
          test -f "dist/haute-${VERSION}.tar.gz"
          test "$(ls dist | wc -l)" -eq 2

      - name: Wheel install smoke
        run: |
          uv venv .pkg-wheel --python 3.12
          uv pip install --python .pkg-wheel/bin/python dist/*.whl
          ./.pkg-wheel/bin/python scripts/package_smoke_check.py
          ./.pkg-wheel/bin/haute --help >/dev/null

      - name: Sdist install smoke
        run: |
          uv venv .pkg-sdist --python 3.12
          uv pip install --python .pkg-sdist/bin/python dist/*.tar.gz
          ./.pkg-sdist/bin/python scripts/package_smoke_check.py
          ./.pkg-sdist/bin/haute --help >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: ${{ !inputs.dry_run }}
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/haute/${{ needs.check.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # A re-run after a partial upload completes it rather than failing on the
      # file that already made it; `verify` then checks the files are this run's.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  verify:
    name: Verify PyPI serves this run's files
    needs: [check, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.22"
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Wait for PyPI to list exactly the built files
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # PyPI's JSON API can lag an upload by a few minutes.
          for attempt in $(seq 1 20); do
            if curl -sSf -o release.json "https://pypi.org/pypi/haute/$VERSION/json" \
              && uv run --no-project python scripts/verify_pypi_release.py \
                --dist dist --pypi-json release.json; then
              exit 0
            fi
            echo "Attempt $attempt: PyPI does not list exactly the built files yet."
            sleep 30
          done
          echo "::error::PyPI does not serve exactly this run's files for haute $VERSION; re-run the failed jobs."
          exit 1

  github-release:
    name: Tag and create the GitHub release
    needs: [check, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Tag the released commit and create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
