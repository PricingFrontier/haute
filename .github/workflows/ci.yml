name: CI

on:
  push:
    # nick-dev is the interim integration branch; drop it from both lists
    # when the nick-dev retirement lands and main becomes the only target.
    branches: [main, nick-dev]
  pull_request:
    branches: [main, nick-dev]

permissions:
  contents: read

jobs:
  # Early-feedback canary: the cheapest checks that historically red CI
  # (ruff format/lint), then the test files most often touched by fix
  # commits. Runs standalone — nothing waits on it; it exists to make PR
  # failures specific and early rather than suite-as-a-whole and late.
  # Subset provenance (refresh occasionally):
  #   git log main --diff-filter=M --name-only --format=% -i --grep=fix \
  #     --grep=bug -- tests/ | grep '^tests/' | sort | uniq -c | sort -rn
  #   Mined 2026-07-06: git_engine 13, model_scorer 12, optimiser_routes 11,
  #   codegen 10, then a four-way tie at 9 (mlflow_io, executor,
  #   codegen_builders, api_contracts). From the tie we keep executor and
  #   api_contracts (core execution + API-contract signal) and drop mlflow_io
  #   (extras-adjacent surface) and codegen_builders (overlaps codegen).
  #   ~2.5 min at -n 4. The known load-sensitive wall-clock benchmark in
  #   test_column_contracts_adoption is deliberately excluded.
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --group dev --locked

      - name: Ruff lint (annotated)
        run: uv run ruff check . --output-format=github

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Canary test subset (historically most regression-prone files)
        run: >
          uv run pytest
          tests/test_git_engine.py
          tests/test_model_scorer.py
          tests/test_optimiser_routes.py
          tests/test_codegen.py
          tests/test_executor.py
          tests/test_api_contracts.py
          -q -n 4 --timeout=60 --timeout-method=signal

  # Fresh-install smoke: wheel (HAUTE_BUILD_FRONTEND=1, never editable) ->
  # fresh venv with fresh dependency resolution -> `haute init` in an empty
  # dir -> headless `haute serve` on packaged static assets -> authed
  # file-listing endpoint -> clean shutdown. Local twin:
  # `scripts/preflight.sh --init-smoke` / `scripts/preflight.ps1 -InitSmoke`.
  init-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fresh-install smoke
        run: uv run --no-project python scripts/init_smoke.py

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: uv sync --group dev --locked

      - name: Backend preflight
        run: bash scripts/preflight.sh --backend-only

  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --group dev --locked

      - name: Python perf lane
        run: uv run python scripts/run_perf_suite.py --output-dir .cache/perf

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-perf-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/perf/

  optional-deps-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --locked --no-group dev
      - run: uv pip install pytest pytest-asyncio httpx
      - name: Optional dependency smoke (core install, no MLflow or Databricks extras)
        run: uv run pytest tests/test_optional_dependency_matrix.py -q

  optional-deps-present-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --group dev --locked
      - name: Optional dependency smoke (extras installed)
        run: uv run pytest tests/test_optional_dependency_extras.py -q

  package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --group dev --locked
      - run: HAUTE_BUILD_FRONTEND=1 uv build --out-dir dist-smoke --sdist --wheel

      - name: Wheel install smoke
        run: |
          uv venv .pkg-wheel --python 3.12
          uv pip install --python .pkg-wheel/bin/python dist-smoke/*.whl
          ./.pkg-wheel/bin/python scripts/package_smoke_check.py
          ./.pkg-wheel/bin/haute --help >/dev/null

      - name: Sdist install smoke
        run: |
          uv venv .pkg-sdist --python 3.12
          uv pip install --python .pkg-sdist/bin/python dist-smoke/*.tar.gz
          ./.pkg-sdist/bin/python scripts/package_smoke_check.py
          ./.pkg-sdist/bin/haute --help >/dev/null

  platform-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --group dev --locked

      - name: Cross-platform path and debt smoke
        run: uv run pytest tests/test_path_resolution.py tests/test_pipeline_runtime_path_validation.py tests/test_test_debt.py tests/test_file_ops.py -q

  mutation-config-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --group dev --locked

      - name: Validate mutation target plan
        run: uv run python scripts/run_mutation_suite.py --dry-run --output-dir .mutation-plan --run-id ci

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: cd .. && bash scripts/preflight.sh --frontend-only

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: uv sync --group dev --locked
        working-directory: .

      - run: npm ci
      - run: ./node_modules/.bin/playwright install --with-deps chromium firefox
      - run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report
            frontend/test-results
