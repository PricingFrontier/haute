name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Push twice to a branch and, without this, both runs go to completion — the first
# validating a commit nobody will merge. Measured over a 300-run sample: 17 CI runs
# were superseded before finishing, at roughly 53 runner-minutes each.
#
# `main` is deliberately excluded from cancellation: a push-to-main run is the record
# of whether main is green, so it must finish even when the next merge lands on top.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Early-feedback canary: the cheapest checks that historically red CI
  # (ruff format/lint), then the core test subset. Runs standalone — nothing
  # waits on it; it exists to make PR failures specific and early rather than
  # suite-as-a-whole and late. The subset lives in scripts/core_test_files.txt
  # (selection rationale + refresh recipe there); it is shared with the
  # dependency-floors job below, the Python 3.14 forward probe, and the
  # scheduled unlocked-resolve lane (dependencies.yml), so a canary refresh
  # re-derives those lanes' subset too.
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # uv is pinned exactly, like the rest of the development tooling; this
      # value is repeated in every workflow and must move together (grep
      # `setup-uv` across .github/workflows/).
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.8.22"
          python-version: "3.12"

      - run: uv sync --group dev --locked

      - name: Ruff lint (annotated)
        run: uv run ruff check . --output-format=github

      # The remedy goes in the step name so it is readable in the checks list without
      # expanding the log, and in an annotation so it also surfaces on the run summary.
      - name: Ruff format check (fix with `uv run ruff format .`)
        run: |
          if ! uv run ruff format --check .; then
            echo "::error title=Ruff format::Formatting differs from ruff's output. Fix with: uv run ruff format . (affected files are named in this step's log)"
            exit 1
          fi

      - name: Canary test subset (core subset — historically most regression-prone files)
        run: >
          uv run pytest $(grep -v '^#' scripts/core_test_files.txt)
          -q -n 4 --timeout=60 --timeout-method=signal

  # Fresh-install smoke: wheel (HAUTE_BUILD_FRONTEND=1, never editable) ->
  # fresh venv with fresh dependency resolution -> `haute init` in an empty
  # dir -> headless `haute serve` on packaged static assets -> authed
  # file-listing endpoint -> clean shutdown. Local twin:
  # `scripts/preflight.sh --init-smoke` / `scripts/preflight.ps1 -InitSmoke`.
  init-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.8.22"
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0

      # The macOS XGBoost and LightGBM wheels load libomp from the system.
      - name: Install libomp (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Fresh-install smoke
        run: uv run --no-project python scripts/init_smoke.py

  # Dependency floors: prove the published floor specifiers in [project]
  # dependencies (and the optional extras, pulled in via the dev group's
  # haute[databricks]) are honest — a lowest-direct resolve must install and
  # pass the core subset. End users resolve fresh against these floors with no
  # lockfile of ours, and nothing else verifies that corner. Runs on 3.11 (the
  # requires-python floor): oldest-python × oldest-deps is where floors
  # actually bind. The dev group is exact-pinned, so lowest-direct moves only
  # the [project] floors; the re-resolved uv.lock is ephemeral CI state and is
  # never committed. A red run means a dishonest floor — raising a floor to
  # green this lane is a maintainer decision, not something a PR does
  # unilaterally.
  dependency-floors:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.8.22"
          python-version: "3.11"

      - name: Re-resolve at published floors (lowest-direct)
        run: uv lock --resolution lowest-direct

      # --frozen (not --locked): sync must take the floor lockfile as-is —
      # freshness checks re-run the default `highest` resolution and would
      # declare the lowest-direct lock stale.
      - run: uv sync --frozen --group dev

      - name: Show the floor resolution (direct dependencies)
        run: uv tree --depth 1 --frozen

      # --frozen again: a bare `uv run` re-locks at the default resolution and
      # would silently swap the floor env back to highest before testing.
      # HAUTE_POLARS_UNPINNED declares the same thing the re-resolve above
      # does: polars is deliberately not at the lockfile's version, so the
      # interface contract test asserts its cap-range half rather than
      # snapshot equality with the version the committed schema records. The
      # floor and the lock happen to name the same polars today; that is a
      # coincidence of this lane, not a property it should depend on.
      - name: Core subset at floors
        env:
          HAUTE_POLARS_UNPINNED: "1"
        run: >
          uv run --frozen pytest $(grep -v '^#' scripts/core_test_files.txt)
          -q -n 4 --timeout=60 --timeout-method=signal

  # Version-independent static gates — run once on the reference interpreter
  # (these were duplicated across the old 3-version backend matrix). The
  # package build lives in package-smoke, not here.
  backend-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.8.22"
          python-version: "3.12"

      - run: uv sync --group dev --locked

      # --output-format=github so a violation becomes a file-and-line annotation on
      # the run summary, matching the canary lane. Without it the same violation is
      # only readable by opening the log.
      - name: Ruff lint (annotated)
        run: uv run ruff check . --output-format=github

      # The remedy goes in the step name so it is readable in the checks list without
      # expanding the log, and in an annotation so it also surfaces on the run summary.
      - name: Ruff format check (fix with `uv run ruff format .`)
        run: |
          if ! uv run ruff format --check .; then
            echo "::error title=Ruff format::Formatting differs from ruff's output. Fix with: uv run ruff format . (affected files are named in this step's log)"
            exit 1
          fi

      - name: Mypy
        run: uv run mypy src/haute/ scripts/

      # Guards the DECLARATION layer only — the lockfile is the supply-chain
      # control and `uv sync --locked` / `npm ci` already enforce it everywhere.
      # This catches the other failure: a new entrant adopting a different
      # pinning posture from everything around it, invisible to every lane
      # because they all resolve from the lock. The script carries the rule and
      # its rationale; it emits its own file-and-line annotations.
      - name: Dependency pins (rule and remedy in scripts/lint_pins.py)
        run: uv run python scripts/lint_pins.py

  # Coverage authority: the full suite on the reference interpreter (3.12),
  # split by test module into 4 shards that run in parallel. Recorded
  # per-module durations (scripts/test_file_durations.json) balance them, and
  # each module runs in exactly one shard (tests/_ci_shards.py). Each shard
  # writes its own coverage data file; the gate job below combines them and
  # enforces the 90% global + per-file critical gates ONCE — coverage is
  # interpreter-independent, so it no longer recomputes on every matrix leg.
  # The matrix must list every shard of `--shard=K/4`: a missing one would
  # silently drop its modules (tests/test_ci_shards.py holds this and the
  # gate's combine list).
  #
  # Each shard also uploads a JUnit report in the xunit1 family, so every test
  # case names its file: the input for refreshing the durations with
  # scripts/refresh_test_durations.py. Both uploads run even when the shard's
  # tests fail, so the gate below can still report what the shard covered.
  backend-coverage-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.8.22"
          python-version: "3.12"

      - run: uv sync --group dev --locked

      # The shard also records the write-sandbox census, every write its
      # observe-mode tests made outside their sandbox, for the gate below.
      - name: Pytest shard ${{ matrix.shard }}/4 (coverage)
        env:
          COVERAGE_FILE: .coverage.shard${{ matrix.shard }}
          HAUTE_TEST_WRITE_SANDBOX_CENSUS_OUT: .cache/write-sandbox/census-shard${{ matrix.shard }}.json
        run: >
          uv run pytest tests/ -q -n 4 --timeout=60 --timeout-method=signal
          --shard=${{ matrix.shard }}/4 --shard-lane=coverage
          --cov=src/haute --cov-branch --cov-report= --cov-fail-under=0
          --junitxml=.cache/junit/coverage-shard${{ matrix.shard }}.xml
          -o junit_family=xunit1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-coverage-${{ matrix.shard }}
          path: .coverage.shard${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-junit-${{ matrix.shard }}
          path: .cache/junit/
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: write-sandbox-census-${{ matrix.shard }}
          path: .cache/write-sandbox/
          if-no-files-found: error
          retention-days: 14

  # The gate runs whenever the shards ran, red or green (`!cancelled()`), as the
  # mutation gate does: a pull request red for an unrelated test still learns
  # what its coverage is, instead of the floors being skipped. A red shard fails
  # the gate's first step explicitly, and every later step still runs.
  backend-coverage-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend-coverage-shard
    if: ${{ !cancelled() }}
    steps:
      - name: Require every coverage shard to pass
        if: ${{ needs.backend-coverage-shard.result != 'success' }}
        run: |
          echo "::error title=Coverage shards::A coverage shard did not pass (${{ needs.backend-coverage-shard.result }}); the steps below still report the coverage its data shows."
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ !cancelled() }}
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        if: ${{ !cancelled() }}
        with:
          version: "0.8.22"
          python-version: "3.12"

      - run: uv sync --group dev --locked
        if: ${{ !cancelled() }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ !cancelled() }}
        with:
          pattern: backend-coverage-*
          merge-multiple: true

      # The global floor and the per-file critical gates are independent invariants,
      # so they get their own steps: the step name in the GitHub UI then tells you
      # which one broke without opening the log. The critical gate runs even when the
      # global floor fails (`!cancelled()`), because a run that breaches both should say
      # so — a masked critical-coverage regression has bitten this repo before.
      - name: Combine coverage shards
        id: combine
        if: ${{ !cancelled() }}
        run: |
          mkdir -p .cache/coverage
          uv run coverage combine .coverage.shard1 .coverage.shard2 .coverage.shard3 .coverage.shard4
          uv run coverage json -o .cache/coverage/backend.json

      - name: Enforce global coverage floor (90%)
        if: ${{ !cancelled() && steps.combine.outcome == 'success' }}
        run: uv run coverage report --fail-under=90 --show-missing

      - name: Enforce per-file critical coverage gates
        if: ${{ !cancelled() && steps.combine.outcome == 'success' }}
        run: uv run python scripts/check_critical_coverage.py --coverage-json .cache/coverage/backend.json

      - name: Changed-code coverage (gates the safety-critical modules, reports the rest)
        if: ${{ !cancelled() && steps.combine.outcome == 'success' }}
        env:
          HAUTE_COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >
          uv run python scripts/check_changed_coverage.py
          --coverage-json .cache/coverage/backend.json
          --base-ref "$HAUTE_COVERAGE_BASE"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ !cancelled() }}
        with:
          pattern: write-sandbox-census-*
          path: .cache/write-sandbox
          merge-multiple: true

      # Every shard's census must be there, and no class of write outside the
      # test sandbox may appear or linger unlisted (tests/write_sandbox.toml).
      - name: Write-sandbox census may not grow
        if: ${{ !cancelled() }}
        run: >
          uv run python scripts/check_write_sandbox_census.py
          .cache/write-sandbox/census-shard1.json .cache/write-sandbox/census-shard2.json
          .cache/write-sandbox/census-shard3.json .cache/write-sandbox/census-shard4.json

  # Compatibility: the full suite (no coverage) on the supported version edges,
  # split by test module into 3 shards per interpreter exactly as the coverage
  # shards are (tests/_ci_shards.py); the matrix must list every shard. The
  # shards balance on the compatibility lane's own durations, since coverage
  # tracing slows some modules far more than others, and upload JUnit reports
  # to refresh that table with scripts/refresh_test_durations.py.
  backend-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        shard: [1, 2, 3]
        repeat: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.8.22"
          python-version: ${{ matrix.python-version }}

      - run: uv sync --group dev --locked

      # `-m` here REPLACES the `-m 'not perf'` in pyproject's addopts rather than
      # combining with it, so both exclusions have to be spelled out. Dropping
      # `not perf` would pull the benchmarks into this lane.
      #
      # `not meta` keeps the repo-health checks (specs/docs consistency) out of
      # the compatibility legs. They read files rather than exercise behaviour,
      # so they cannot fail here for a version-specific reason — but when they
      # do fail they previously failed identically on 3.11, 3.13 and a coverage
      # shard at once. Run 31129979759 is the worked example: one uncovered
      # frontend source, four red jobs. The shards still run them.
      - name: Pytest shard ${{ matrix.shard }}/3 (compat, no coverage)
        run: >
          uv run pytest tests/ -q -n 4 --timeout=60 --timeout-method=signal
          -m "not perf and not meta"
          --shard=${{ matrix.shard }}/3 --shard-lane=compat
          --junitxml=.cache/junit/compat-${{ matrix.python-version }}-shard${{ matrix.shard }}.xml
          -o junit_family=xunit1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-compat-junit-${{ matrix.python-version }}-${{ matrix.shard }}-${{ matrix.repeat }}
          path: .cache/junit/
          retention-days: 14

  # Production runs previews, traces, free-code steps and the optimiser estimate
  # in warm worker processes; the rest of the suite runs them in threads so
  # tests can patch in-process seams (tests/conftest.py). This lane runs a route
  # slice the way production does, so a defect that shows only across the
  # process boundary (result serialisation, worker preload, environment
  # propagation) is red here. A test in the slice that patches an in-process
  # seam carries the `in_process` marker and stays in threads.
  backend-process-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.8.22"
          python-version: "3.12"

      - run: uv sync --group dev --locked

      - name: Route slice in process mode (preview, trace, free-code steps, optimiser estimate)
        env:
          HAUTE_TEST_INTERACTIVE_EXECUTION_MODE: process
        run: >
          uv run pytest
          tests/test_interactive_route_isolation.py
          tests/test_server.py
          tests/test_trace_api.py
          tests/test_trace_multi_frame.py
          tests/test_adversarial_inputs.py
          tests/test_security_gaps.py
          -q -n 4 --timeout=120 --timeout-method=signal

  # Forward-looking, NON-BLOCKING probe: does haute install + its core test
  # subset pass on Python 3.14? `continue-on-error` keeps it off the required
  # set; it fails fast at dependency sync (catboost is the likely cp314-wheel
  # blocker) and the diagnostic step names that failure mode so a red probe is
  # self-explaining.
  #
  # It runs the curated core subset rather than the whole suite. The probe's
  # value is the dependency-sync signal plus a forward-compat regression catch;
  # a second full-suite pass duplicates the 3.12 coverage shards. As a
  # continue-on-error job it could never block anything, so the full run was
  # costing every pull request ~367 s (49-sample mean) and contributing 18
  # failures of pure noise to the sampled corpus.
  backend-314-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.8.22"
          python-version: "3.14"

      - name: Dependency sync (fails fast if a dep lacks cp314 wheels)
        id: sync
        run: uv sync --group dev --locked

      - name: Diagnose a sync failure
        if: failure() && steps.sync.outcome == 'failure'
        run: echo "::warning title=py3.14 probe::uv sync failed on Python 3.14 — a dependency lacks cp314 wheels (most likely catboost). Expected until native wheels catch up; this probe is non-blocking."

      - name: Core subset (3.14, no coverage)
        if: steps.sync.outcome == 'success'
        run: >
          uv run pytest $(grep -v '^#' scripts/core_test_files.txt)
          -q -n 4 --timeout=60 --timeout-method=signal

  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.8.22"
          python-version: "3.12"

      - run: uv sync --group dev --locked

      - name: Python perf lane
        run: >
          uv run python scripts/run_perf_suite.py --output-dir .cache/perf --max-test-seconds 180
          --pytest-arg=-m "--pytest-arg=perf and not perf_evidence"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: python-perf-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/perf/

  # Core-only install: the project with the test harness group alone, never the
  # dev group, whose haute[databricks] restores the SQL connector and makes the
  # whole smoke module skip. Every later command is `uv run --no-sync`, because a
  # bare `uv run` syncs the default groups back in.
  optional-deps-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.8.22"
          python-version: "3.12"

      - run: uv sync --locked --no-default-groups --group test-harness

      # Outside the smoke module's own skip, which lets a full development
      # environment pass over it: here an environment that is not core-only fails.
      - name: Core-only environment (core MLflow present, Databricks SQL connector absent)
        run: |
          uv run --no-sync python - <<'PY'
          import importlib.util
          import sys

          problems = []
          if importlib.util.find_spec("mlflow") is None:
              problems.append("core MLflow is not installed")
          try:
              connector = importlib.util.find_spec("databricks.sql")
          except ModuleNotFoundError:
              connector = None
          if connector is not None:
              problems.append("the Databricks SQL connector is installed")
          for problem in problems:
              print(f"::error title=Core-only lane::{problem}")
          sys.exit(1 if problems else 0)
          PY

      - name: Optional dependency smoke (core MLflow, no Databricks SQL connector)
        run: uv run --no-sync pytest tests/test_optional_dependency_matrix.py -q

  optional-deps-present-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.8.22"
          python-version: "3.12"

      - run: uv sync --group dev --locked
      - name: Optional dependency smoke (extras installed)
        run: uv run pytest tests/test_optional_dependency_extras.py -q

  package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.8.22"
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0

      - run: uv sync --group dev --locked
      - run: HAUTE_BUILD_FRONTEND=1 uv build --out-dir dist-smoke --sdist --wheel

      - name: Wheel install smoke
        run: |
          uv venv .pkg-wheel --python 3.12
          uv pip install --python .pkg-wheel/bin/python dist-smoke/*.whl
          ./.pkg-wheel/bin/python scripts/package_smoke_check.py
          ./.pkg-wheel/bin/haute --help >/dev/null

      - name: Sdist install smoke
        run: |
          uv venv .pkg-sdist --python 3.12
          uv pip install --python .pkg-sdist/bin/python dist-smoke/*.tar.gz
          ./.pkg-sdist/bin/python scripts/package_smoke_check.py
          ./.pkg-sdist/bin/haute --help >/dev/null

  platform-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.8.22"
          python-version: "3.12"

      # The macOS XGBoost and LightGBM wheels load libomp from the system.
      - name: Install libomp (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - run: uv sync --group dev --locked

      - name: Model-family native engines (fit, save, reload, score)
        run: >
          uv run pytest
          tests/test_xgboost_family.py
          tests/test_lightgbm_family.py
          tests/test_ebm_family.py
          -q

      - name: Cross-platform path, process isolation, spill, cache, and debt smoke
        run: >
          uv run pytest
          tests/test_path_resolution.py
          tests/test_pipeline_runtime_path_validation.py
          tests/test_test_debt.py
          tests/test_file_ops.py
          tests/test_write_sandbox_guard.py
          tests/test_data_io_roundtrips.py
          tests/test_process_memory.py
          tests/test_cpu_performance.py
          tests/test_cpu_performance_startup.py
          tests/test_cpu_performance_json_pools.py
          tests/test_cpu_performance_windows.py
          tests/test_worker_isolation.py
          tests/test_interactive_worker_pool.py
          tests/test_interactive_route_isolation.py
          tests/test_json_direct_spill.py
          tests/test_api_input_table_snapshots.py
          tests/test_json_runtime_storage.py
          -q

  # The documentation site builds strictly on every pull request, not only when a
  # merge to main deploys it (docs.yml), so a broken nav entry or dead link is red
  # before it merges rather than at the Pages deploy.
  docs-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.8.22"
          python-version: "3.12"

      - run: uv sync --group dev --locked

      - name: Documentation site (strict build)
        run: uv run mkdocs build --strict

  mutation-config-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.8.22"
          python-version: "3.12"

      - run: uv sync --group dev --locked

      - name: Validate mutation target plan
        run: uv run python scripts/run_mutation_suite.py --dry-run --output-dir .mutation-plan --run-id ci

  # The frontend gates run as two parallel jobs that together run exactly the
  # npm scripts of `scripts/preflight.sh --frontend-only`, the local equivalent
  # (tests/test_frontend_bundle_budget_ci.py holds that). As in preflight, every
  # check runs even after another has failed, so one run reports all of them;
  # only the bundle budget waits for a successful build.
  frontend-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0

      - id: install
        run: npm ci

      - name: Generated API contracts (regenerate with `npm run generate:contracts`)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:contracts

      - name: TypeScript type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: ESLint (fix with `npm run lint -- --fix`)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - id: build
        name: Frontend build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      - name: Frontend bundle budget
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run check:bundle

      - name: Frontend PR benchmark gate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:benchmark:pr

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0

      - run: npm ci

      - name: Vitest with coverage thresholds and critical coverage
        run: npm run test:coverage

  # Two Playwright shards, each with its own server and report. Playwright
  # splits by test count over whole spec files, so the two shards differ in
  # duration.
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.8.22"
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0

      - run: uv sync --group dev --locked
        working-directory: .

      - run: npm ci
      # Downloading both browsers costs ~61 s on every run (49-sample mean) and
      # was the largest uncached setup cost in CI — by contrast `uv sync`
      # already averages 9 s, so Python dependency caching needs nothing. Both
      # browsers are genuinely used (the `chromium` and `firefox-smoke`
      # projects in playwright.config.ts), so the fix is to cache them rather
      # than to drop one. On a Playwright version bump the exact key misses,
      # the restore-key returns the previous browsers, and the install step
      # fetches only what changed.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - run: ./node_modules/.bin/playwright install --with-deps chromium firefox
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/2
        env:
          # A browser test that passes only on a retry fails a push to main;
          # on a pull request the step below names it in the job summary.
          HAUTE_E2E_FAIL_ON_FLAKY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '0' }}

      - name: Name the flaky browser tests in the job summary
        if: ${{ !cancelled() }}
        working-directory: .
        run: >
          uv run python scripts/report_flaky_browser_tests.py
          --report frontend/test-results/report.json
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-e2e-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report
            frontend/test-results
