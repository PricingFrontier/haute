name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Early-feedback canary: the cheapest checks that historically red CI
  # (ruff format/lint), then the core test subset. Runs standalone — nothing
  # waits on it; it exists to make PR failures specific and early rather than
  # suite-as-a-whole and late. The subset lives in scripts/core_test_files.txt
  # (selection rationale + refresh recipe there); it is shared with the
  # dependency-floors job below and the scheduled unlocked-resolve lane
  # (dependencies.yml), so a canary refresh re-derives those lanes' subset too.
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --group dev --locked

      - name: Ruff lint (annotated)
        run: uv run ruff check . --output-format=github

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Canary test subset (core subset — historically most regression-prone files)
        run: >
          uv run pytest $(grep -v '^#' scripts/core_test_files.txt)
          -q -n 4 --timeout=60 --timeout-method=signal

  # Fresh-install smoke: wheel (HAUTE_BUILD_FRONTEND=1, never editable) ->
  # fresh venv with fresh dependency resolution -> `haute init` in an empty
  # dir -> headless `haute serve` on packaged static assets -> authed
  # file-listing endpoint -> clean shutdown. Local twin:
  # `scripts/preflight.sh --init-smoke` / `scripts/preflight.ps1 -InitSmoke`.
  init-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Fresh-install smoke
        run: uv run --no-project python scripts/init_smoke.py

  # Dependency floors: prove the published floor specifiers in [project]
  # dependencies (and the optional extras, pulled in via the dev group's
  # haute[databricks]) are honest — a lowest-direct resolve must install and
  # pass the core subset. End users resolve fresh against these floors with no
  # lockfile of ours, and nothing else verifies that corner. Runs on 3.11 (the
  # requires-python floor): oldest-python × oldest-deps is where floors
  # actually bind. The dev group is exact-pinned, so lowest-direct moves only
  # the [project] floors; the re-resolved uv.lock is ephemeral CI state and is
  # never committed. A red run means a dishonest floor — raising a floor to
  # green this lane is a maintainer decision, not something a PR does
  # unilaterally.
  dependency-floors:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Re-resolve at published floors (lowest-direct)
        run: uv lock --resolution lowest-direct

      # --frozen (not --locked): sync must take the floor lockfile as-is —
      # freshness checks re-run the default `highest` resolution and would
      # declare the lowest-direct lock stale.
      - run: uv sync --frozen --group dev

      - name: Show the floor resolution (direct dependencies)
        run: uv tree --depth 1 --frozen

      # --frozen again: a bare `uv run` re-locks at the default resolution and
      # would silently swap the floor env back to highest before testing.
      - name: Core subset at floors
        run: >
          uv run --frozen pytest $(grep -v '^#' scripts/core_test_files.txt)
          -q -n 4 --timeout=60 --timeout-method=signal

  # Version-independent static gates + package build — run once on the
  # reference interpreter (these were duplicated across the old 3-version
  # backend matrix).
  backend-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --group dev --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src/haute/

  # Coverage authority: the full suite on the reference interpreter (3.12),
  # split into 2 balanced shards run in parallel (pytest-split). Each shard
  # writes its own coverage data file; the gate job below combines them and
  # enforces the 90% global + per-file critical gates ONCE — coverage is
  # interpreter-independent, so it no longer recomputes on every matrix leg.
  backend-coverage-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --group dev --locked

      - name: Pytest shard ${{ matrix.shard }}/2 (coverage)
        env:
          COVERAGE_FILE: .coverage.shard${{ matrix.shard }}
        run: >
          uv run pytest tests/ -q -n 4 --timeout=60 --timeout-method=signal
          --splits 2 --group ${{ matrix.shard }}
          --cov=src/haute --cov-branch --cov-report= --cov-fail-under=0

      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ matrix.shard }}
          path: .coverage.shard${{ matrix.shard }}
          include-hidden-files: true
          retention-days: 1

  backend-coverage-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend-coverage-shard
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --group dev --locked

      - uses: actions/download-artifact@v4
        with:
          pattern: backend-coverage-*
          merge-multiple: true

      - name: Combine coverage + enforce global 90% + per-file critical gates
        run: |
          mkdir -p .cache/coverage
          uv run coverage combine .coverage.shard1 .coverage.shard2
          uv run coverage report --fail-under=90 --show-missing
          uv run coverage json -o .cache/coverage/backend.json
          uv run python scripts/check_critical_coverage.py --coverage-json .cache/coverage/backend.json

  # Compatibility: the full suite (no coverage) on the supported version edges.
  backend-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: uv sync --group dev --locked

      - name: Pytest (compat, no coverage)
        run: uv run pytest tests/ -q -n 4 --timeout=60 --timeout-method=signal

  # Forward-looking, NON-BLOCKING probe: does haute install + its suite pass on
  # Python 3.14? `continue-on-error` keeps it off the required set; it fails
  # fast at dependency sync (catboost is the likely cp314-wheel blocker) and the
  # diagnostic step names that failure mode so a red probe is self-explaining.
  backend-314-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Dependency sync (fails fast if a dep lacks cp314 wheels)
        id: sync
        run: uv sync --group dev --locked

      - name: Diagnose a sync failure
        if: failure() && steps.sync.outcome == 'failure'
        run: echo "::warning title=py3.14 probe::uv sync failed on Python 3.14 — a dependency lacks cp314 wheels (most likely catboost). Expected until native wheels catch up; this probe is non-blocking."

      - name: Pytest (3.14, no coverage)
        if: steps.sync.outcome == 'success'
        run: uv run pytest tests/ -q -n 4 --timeout=60 --timeout-method=signal

  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --group dev --locked

      - name: Python perf lane
        run: uv run python scripts/run_perf_suite.py --output-dir .cache/perf

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-perf-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/perf/

  optional-deps-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --locked --no-group dev
      - run: uv pip install pytest pytest-asyncio httpx
      - name: Optional dependency smoke (core MLflow, no Databricks SQL connector)
        run: uv run pytest tests/test_optional_dependency_matrix.py -q

  optional-deps-present-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --group dev --locked
      - name: Optional dependency smoke (extras installed)
        run: uv run pytest tests/test_optional_dependency_extras.py -q

  package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - run: uv sync --group dev --locked
      - run: HAUTE_BUILD_FRONTEND=1 uv build --out-dir dist-smoke --sdist --wheel

      - name: Wheel install smoke
        run: |
          uv venv .pkg-wheel --python 3.12
          uv pip install --python .pkg-wheel/bin/python dist-smoke/*.whl
          ./.pkg-wheel/bin/python scripts/package_smoke_check.py
          ./.pkg-wheel/bin/haute --help >/dev/null

      - name: Sdist install smoke
        run: |
          uv venv .pkg-sdist --python 3.12
          uv pip install --python .pkg-sdist/bin/python dist-smoke/*.tar.gz
          ./.pkg-sdist/bin/python scripts/package_smoke_check.py
          ./.pkg-sdist/bin/haute --help >/dev/null

  platform-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --group dev --locked

      - name: Cross-platform path and debt smoke
        run: uv run pytest tests/test_path_resolution.py tests/test_pipeline_runtime_path_validation.py tests/test_test_debt.py tests/test_file_ops.py tests/test_write_sandbox_guard.py tests/test_data_io_roundtrips.py -q

  mutation-config-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --group dev --locked

      - name: Validate mutation target plan
        run: uv run python scripts/run_mutation_suite.py --dry-run --output-dir .mutation-plan --run-id ci

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - run: npm ci
      - run: cd .. && bash scripts/preflight.sh --frontend-only

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - run: uv sync --group dev --locked
        working-directory: .

      - run: npm ci
      - run: ./node_modules/.bin/playwright install --with-deps chromium firefox
      - run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report
            frontend/test-results
