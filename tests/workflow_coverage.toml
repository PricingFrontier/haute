  "tests/test_cli_serve.py::TestServe::test_serve_help_states_the_effective_host_and_port_defaults",
  "tests/test_cli_fail_loudly.py::TestServePortConflictDetection::test_serve_fails_loudly_when_port_is_bound",
  "tests/test_cli.py::TestRun::test_run_explicit_file",
  "tests/test_cli.py::TestRun::test_run_file_not_found",
  "tests/test_cli.py::TestRun::test_run_parse_error",
  "tests/test_cli.py::TestRun::test_run_reports_node_errors",
  "tests/test_cli_fail_loudly.py::TestStatusInstallInstructionIsCorrect::test_mlflow_missing_message_uses_uv_add_haute_databricks",
  "tests/test_hatch_build.py::test_invalid_build_flag_fails_before_editable_early_return",
  "tests/test_hosted.py::TestEnvironmentDetection::test_partial_contract_fails_loud",
  "tests/test_hosted.py::TestCreateApp::test_refuses_to_run_outside_hosted_environment",
  "tests/test_hosted.py::TestBoundaryDoesNotBypassLocalAuth::test_header_rewriting_alone_grants_nothing",
  "tests/test_hosted.py::TestEnsureProject::test_unbound_boot_seeds_a_volatile_project_and_chdirs_into_it",
  "tests/test_hosted.py::TestEnsureProject::test_a_restored_or_present_boot_never_reseeds",
