name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "rating/**"
      - "tests/quotes/**"
      - "haute.toml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/ci.yml

  deploy-staging:
    name: Deploy → Staging
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABRICKS_MLFLOW_HOST: ${{ secrets.DATABRICKS_MLFLOW_HOST }}
      DATABRICKS_MLFLOW_TOKEN: ${{ secrets.DATABRICKS_MLFLOW_TOKEN }}
      DATABRICKS_RATING_HOST: ${{ secrets.DATABRICKS_RATING_HOST }}
      DATABRICKS_RATING_TOKEN: ${{ secrets.DATABRICKS_RATING_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Deploy to staging
        run: uv run haute deploy --endpoint-suffix "-staging"

  smoke-test:
    name: Smoke Test Staging
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABRICKS_MLFLOW_HOST: ${{ secrets.DATABRICKS_MLFLOW_HOST }}
      DATABRICKS_MLFLOW_TOKEN: ${{ secrets.DATABRICKS_MLFLOW_TOKEN }}
      DATABRICKS_RATING_HOST: ${{ secrets.DATABRICKS_RATING_HOST }}
      DATABRICKS_RATING_TOKEN: ${{ secrets.DATABRICKS_RATING_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Score test quotes against staging endpoint
        run: uv run haute smoke --endpoint-suffix "-staging"

  impact-analysis:
    name: Impact Analysis
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABRICKS_MLFLOW_HOST: ${{ secrets.DATABRICKS_MLFLOW_HOST }}
      DATABRICKS_MLFLOW_TOKEN: ${{ secrets.DATABRICKS_MLFLOW_TOKEN }}
      DATABRICKS_RATING_HOST: ${{ secrets.DATABRICKS_RATING_HOST }}
      DATABRICKS_RATING_TOKEN: ${{ secrets.DATABRICKS_RATING_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Compare staging vs production predictions
        run: uv run haute impact --endpoint-suffix "-staging"
      - name: Upload impact report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: impact-report
          path: impact_report.md
      - name: Record deployed SHA
        run: >-
          echo "Staged commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
