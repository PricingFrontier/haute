name: Set up the project
description: Install uv and the locked dependencies, on the Python .python-version names.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true
    - run: uv sync --frozen
      shell: bash
