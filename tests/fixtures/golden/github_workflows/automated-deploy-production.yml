name: Deploy → Production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: >
          Git SHA that was staged & impact-analysed.
          Leave blank to deploy current HEAD of main (less safe).
        required: false
        type: string

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABRICKS_MLFLOW_HOST: ${{ secrets.DATABRICKS_MLFLOW_HOST }}
      DATABRICKS_MLFLOW_TOKEN: ${{ secrets.DATABRICKS_MLFLOW_TOKEN }}
      DATABRICKS_RATING_HOST: ${{ secrets.DATABRICKS_RATING_HOST }}
      DATABRICKS_RATING_TOKEN: ${{ secrets.DATABRICKS_RATING_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify commit matches staged SHA
        if: inputs.sha != ''
        run: |
          if [ "$GITHUB_SHA" != "${{ inputs.sha }}" ]; then
            echo "::error::HEAD ($GITHUB_SHA) does not match" \
              "staged SHA (${{ inputs.sha }}). Merge may have occurred since staging."
            exit 1
          fi
      - uses: ./.github/actions/setup
      - name: Deploy to production
        run: uv run haute deploy
      - name: Tag release
        run: |
          set -euo pipefail
          VERSION="$(uv run haute status --version-only)"
          case "$VERSION" in
            ''|*[!0-9]*)
              echo "haute status printed no model version: $VERSION" >&2
              exit 1
              ;;
          esac
          git tag "deploy/v$VERSION"
          git push origin "deploy/v$VERSION"
