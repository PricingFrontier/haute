# The observe-mode census: each class of write outside the sandbox that a
# coverage run still records, and why. scripts/check_write_sandbox_census.py
# names the classes and fails the coverage gate on a class not listed here, or
# on a listed class no run recorded.
[census]

[census."repo:.haute_cache"]
reason = """\
    Production code keeps its cache and logs under the project's .haute_cache \
    (training's memory log, the deploy output-schema cache, the runtime spill \
    store and its storage budget), and observe-mode tests leave the project \
    root at the repository root."""

[census."repo:mlruns"]
reason = """\
    MLflow's default tracking store is ./mlruns: tests that log a run or score \
    a registered model without pointing MLflow at a sandbox store create it \
    under the repository root."""

[census."runner-temp:_runner_file_commands"]
reason = """\
    The coverage scripts and the CLI's impact report append a job summary to \
    $GITHUB_STEP_SUMMARY, which on a runner is the summary file of the step \
    running the tests."""
