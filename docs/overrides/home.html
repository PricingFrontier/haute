{% extends "main.html" %}

{% block tabs %}
  {{ super() }}

  <section class="haute-hero">
    <div class="haute-hero__inner">
      <h1 class="haute-hero__title">Haute</h1>
      <p class="haute-hero__subtitle">
        Documentation for the open-source pricing engine for insurance teams.
      </p>
      <div class="haute-hero__actions">
        <a href="{{ 'getting-started/' | url }}" class="haute-hero__button haute-hero__button--primary">Get started</a>
        <a href="{{ config.repo_url }}" class="haute-hero__button haute-hero__button--secondary">View on GitHub</a>
      </div>
    </div>
  </section>
{% endblock %}

{% block content %}
  {{ page.content }}
{% endblock %}
