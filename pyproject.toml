[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
exclude = ["tests/", "docs/"]

[[tool.mypy.overrides]]
module = [
    "catboost.*",
    "joblib.*",
    "mlflow.*",
    "watchfiles.*",
    "libcst.*",
    "databricks.*",
    "pyarrow.*",
    "pandas.*",
    "scipy.*",
    "sklearn.*",
    "price_contour.*",
    "interpret.*",
]
ignore_missing_imports = true
