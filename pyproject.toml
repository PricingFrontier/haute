[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "haute"
version = "0.4.0"
description = "Haute - Open-source pricing engine for insurance teams"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [
    { name = "Pricing Frontier" },
]
keywords = ["pricing", "insurance", "actuarial", "rating-engine", "catboost", "polars"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "fastapi>=0.139.2,<0.140",
    "uvicorn[standard]>=0.40.0,<0.41",
    "websockets>=16.0,<17",
    "pydantic>=2.12.5,<3",
    "polars>=1.44.2,<2",
    # Direct dependency, not just transitive: parquet metadata reads, the
    # parquet writer in _json_shred, the model scorer and _database_io all
    # import pyarrow themselves. Cap: pyarrow 25.0.0 segfaults in
    # pq.read_metadata on Linux x86-64 (issue #192; 24.0.0 was clean in the
    # same CI probe). Floor: 23.0.1 is the lowest version any CI lane has
    # exercised (the lock); nothing below it is known to work.
    "pyarrow>=23.0.1,<25",
    "click>=8.4.2,<9",
    "python-multipart>=0.0.31,<0.1",
    "python-dotenv>=1.2.2,<2",
    "libcst>=1.8.6,<2",
    "watchfiles>=1.1.1,<2",
    "catboost>=1.2.10,<2",
    # XGBoost 3.3+ requires Python 3.12; the cap keeps it on every supported
    # Python (and on Databricks Model Serving's 3.11). The CPU-only
    # distribution avoids the full wheel's NVIDIA NCCL dependency; macOS has
    # no xgboost-cpu wheel, so it takes xgboost (which then needs libomp).
    # Both install the same ``xgboost`` import package: never hold both.
    "xgboost-cpu>=3.2,<3.3; sys_platform != 'darwin'",
    "xgboost>=3.2,<3.3; sys_platform == 'darwin'",
    # LightGBM's macOS wheel also loads libomp from the system (Homebrew).
    "lightgbm>=4.7,<5",
    # A .ebm model loads only under the exact interpret-core version its
    # contract records, so a minor bump is a deliberate retrain boundary.
    "interpret-core>=0.7.8,<0.8",
    # Tuning owns a reproducibility-sensitive seeded TPE contract. Keep the
    # supported Optuna sampler implementation within one pinned 4.x minor.
    "optuna>=4.9.0,<4.10",
    # Direct dependency: the restricted joblib loader relies on private
    # numpy_pickle APIs introduced in joblib 1.5.
    "joblib>=1.5,<2",
    "numpy>=2.0,<3",
    "structlog>=25.5.0,<26",
    "orjson>=3.11.7,<4",
    # Native structural filter for exact, complete structured-input inference.
    "msgspec>=0.21.1,<0.22",
    "price-contour>=0.4.1,<0.5",
    "rustystats>=0.9.0,<0.10",
    # Core: Model Scoring and the MLflow registry are first-class palette
    # features. The extra below pins supported Databricks clients and adds SQL.
    "mlflow>=3.11.0,<4",
    # Direct dependency (not just transitive via catboost): the GLM
    # dispersion estimator uses scipy.optimize.minimize_scalar.
    "scipy>=1.16.0,<2",
    # Direct dependency (not just transitive via mlflow and catboost): every
    # pyfunc score and every categorical CatBoost pool goes through
    # to_pandas() and select_dtypes(include=["datetimetz"]) in _mlflow_io, and
    # that frame feeds MLflow's schema enforcement. pandas 3 changes the default
    # string dtype and copy semantics, so the cap is the point; the floor is
    # the version CI has run (the lock).
    "pandas>=2.3,<3",
    "xxhash>=3.6.0,<4",
    "packaging>=25.0,<26",
    # Assistant provider SDKs are core: the assistant ships in every install
    # (imported lazily at the adapter seam, so importing haute stays inert).
    "anthropic>=0.40",
    "openai>=1.55",
    "tomlkit>=0.15.1",
    # One reader for process and host memory on every platform: resident, private and
    # virtual bytes for worker caps and supervision, and host available RAM.
    "psutil>=7.0,<8",
]

[project.urls]
Homepage = "https://haute.dev"
Repository = "https://github.com/PricingFrontier/haute"
Documentation = "https://haute.dev"

[project.optional-dependencies]
databricks = [
    "databricks-sdk>=0.88.0,<0.89",
    "databricks-sql-connector>=4.2.5,<5",
]
[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    # Inline per-test failure annotations on GitHub PRs; self-activates only
    # when GITHUB_ACTIONS is set, inert locally.
    "pytest-github-actions-annotate-failures==0.4.2",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    # Split the suite into balanced groups for the sharded backend-coverage CI
    # lane (pytest --splits N --group G); combined via `coverage combine`.
    "pytest-split==0.11.0",
    "httpx==0.28.1",
    "ruff==0.15.0",
    "mypy==1.19.1",
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "haute[databricks]",
    "hypothesis==6.151.9",
    "types-psutil==7.2.2.20260906",
]

[project.scripts]
haute = "haute.cli:cli"

[tool.hatch.build]
artifacts = [
    "src/haute/static/**",
    "src/haute/assistant/assets/**",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
exclude = [
    "frontend/",
    "docs/",
    "examples/",
    "tests/",
    "pipelines/",
    "my_project/",
    "output/",
    ".env.example",
    ".python-version",
    "haute.toml",
    "uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["src/haute"]


[tool.ruff]
line-length = 100
target-version = "py311"
# Root-level generated/demo pipelines are arbitrary user code; keep repo lint
# focused on the package, tests, docs tooling, and scripts.
extend-exclude = [
    ".codex-pytest-*",
    ".ops-pytest-temp/",
    ".providers-pytest-temp/",
    ".pytest-tmp*/",
    "modules/",
    "examples/",
    "outputs/",
]

[tool.ruff.lint]
# Preview mode is enabled solely to activate the explicitly-named preview rule
# PLW1514 (in select below). explicit-preview-rules keeps every *other* preview
# rule off, so nothing else from preview leaks into the lint gate.
preview = true
explicit-preview-rules = true
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "UP",
    # Incremental bugbear / pytest-style / security ratchet.
    "B006",
    "B008",
    "B009",
    "B010",
    "B012",
    # pytest.raises(Exception) accepts any failure — a test written to
    # prove "malformed input is rejected" stays green if the code crashes
    # on an unrelated typo.  PT011 flags that; existing sites that are broad
    # by design carry `# noqa: PT011` with a reason, so the rule ratchets:
    # new broad catches are blocked while the baseline stays tightenable.
    # Scoped below to Exception/BaseException only — see
    # [tool.ruff.lint.flake8-pytest-style].
    "PT011",
    "PT013",
    "S506",
    # Require an explicit encoding on every text open/read/write. Without one,
    # Python falls back to the platform's locale encoding, so a file written as
    # UTF-8 on Linux/macOS and read back under cp1252 on Windows silently
    # mangles non-ASCII bytes. (Preview rule; enabled via the flags above.)
    "PLW1514",
    # Pathlib migration -- platform portability. Prefer pathlib.Path over
    # os.path string ops so a filesystem path stays a Path object, keeping the
    # str(path) vs path.as_posix() serialization choice explicit at each call
    # site. The bug class this guards against: str(Path(...)) renders with
    # backslash separators on Windows, and a backslash path leaked into
    # generated Python source is misread as an escape sequence. Scope is the
    # portable subset below only; the open()/getcwd/abspath-class PTH rules are
    # deliberately excluded.
    "PTH101",  # os.chmod          -> Path.chmod
    "PTH110",  # os.path.exists    -> Path.exists
    "PTH116",  # os.stat           -> Path.stat
    "PTH118",  # os.path.join      -> Path(...) / ...
    "PTH119",  # os.path.basename  -> Path.name
    "PTH120",  # os.path.dirname   -> Path.parent
    "PTH201",  # Path(".") / Path("") -> Path()
    # Cyclomatic complexity. The graph walker holds every execution's walk, so
    # its functions stay at 15 or below (EXEC-R05); the rule is scoped to that
    # module by the per-file ignore below.
    "C901",
]

[tool.ruff.lint.flake8-pytest-style]
# PT011 defaults to flagging ValueError and OSError as well, which would demand a
# `match=` on ~54 existing assertions that already name a specific exception. The
# defect we are ratcheting against is the *bare* catch — `pytest.raises(Exception)`
# passes when the code fails for a completely unrelated reason — so the rule is
# narrowed to that. Tightening a ValueError assertion with `match=` is still a good
# thing to do; it is just not something CI should demand.
raises-require-match-for = ["BaseException", "Exception"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"src/haute/schemas.py" = ["N815"]  # camelCase fields match frontend JSON API
"!src/haute/_graph_walker.py" = ["C901"]  # the complexity limit covers the walker only

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not perf' --strict-markers --strict-config"
xfail_strict = true
markers = [
    "slow: marks tests as slow but still part of the default suite",
    "perf: marks benchmark-style tests excluded from default pytest runs",
    "sandbox_strict: opts a test into the strict write-sandbox (see tests/_write_sandbox.py)",
    "meta: repo-health checks that read files rather than exercise behaviour, so their result cannot vary by interpreter; deselected from the compatibility lanes (see .github/workflows/ci.yml)",
]
filterwarnings = [
    "error::RuntimeWarning",
    "ignore:Mean of empty slice:RuntimeWarning",
    "ignore:invalid value encountered in scalar divide:RuntimeWarning",
]

[tool.coverage.run]
source = ["src/haute"]
branch = true
omit = ["src/haute/assistant/assets/*"]
# Store relative file paths in coverage data so the sharded backend-coverage CI
# lane can `coverage combine` data files produced on separate runner VMs (whose
# absolute checkout paths differ). Without this, combine sees disjoint absolute
# paths and the merged report is wrong. Local monolithic runs are unaffected.
relative_files = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]

[tool.haute.changed_coverage]
coverage_json = ".cache/coverage/backend.json"
min_statement_coverage = 100.0
min_branch_coverage = 100.0
# The safety-critical modules (specs/engineering-quality/high-level.md): changed
# code in them must be fully covered. Changed code elsewhere under report_paths
# is reported in the job summary without failing the build.
paths = [
    # Rating
    "src/haute/_rating.py",
    "src/haute/_rating_step_config.py",
    "src/haute/_banding_config.py",
    # Deploy scoring
    "src/haute/deploy/_scorer.py",
    "src/haute/deploy/_batch_scoring.py",
    "src/haute/deploy/_model_code.py",
    "src/haute/deploy/_pruner.py",
    "src/haute/deploy/_schema.py",
    "src/haute/_model_scorer.py",
    "src/haute/_output_assembler.py",
    "src/haute/_jsonpath.py",
    "src/haute/modelling/_native_pyfunc.py",
    # Feature contracts
    "src/haute/modelling/_feature_contract.py",
    "src/haute/modelling/_native_encoding.py",
    "src/haute/modelling/_signature.py",
    # Cache identity
    "src/haute/_cache.py",
    "src/haute/_stat_gated_cache.py",
    "src/haute/_hashing.py",
    # Snapshot publication
    "src/haute/_source_cache.py",
    "src/haute/_node_snapshots.py",
    "src/haute/_file_lock.py",
    "src/haute/_json_shred/_snapshots.py",
    "src/haute/_json_shred/_writer.py",
    "src/haute/_json_shred/_shred.py",
    "src/haute/_json_shred/_records.py",
    "src/haute/_json_shred/_runtime_storage.py",
    "src/haute/_json_shred/_inference.py",
    "src/haute/_json_shred/_inference_filter.py",
    "src/haute/_json_shred/_cache.py",
    # Cache identity
    "src/haute/_json_shred/_source_proof.py",
    "src/haute/_json_shred/_inference_cache.py",
]
report_paths = ["src/haute"]

[tool.haute.critical_coverage]
coverage_json = ".cache/coverage/backend.json"
# Per-file floors for the safety-critical modules only (the same set as
# [tool.haute.changed_coverage].paths).

[[tool.haute.critical_coverage.files]]
path = "src/haute/_rating.py"
min_statement_coverage = 92.0
min_branch_coverage = 88.0
rationale = "Rating: Rating-table lookups and banding turn factors into the price. Seeded 2 points below the 24 September 2026 CI measurement."

[[tool.haute.critical_coverage.files]]
path = "src/haute/_rating_step_config.py"
min_statement_coverage = 95.0
min_branch_coverage = 92.0
rationale = "Rating-table value validation, normalisation and sidecar round-trip on the premium path; rejects non-finite/non-numeric/bool cells that would otherwise silently mis-price."

[[tool.haute.critical_coverage.files]]
path = "src/haute/_banding_config.py"
min_statement_coverage = 95.0
min_branch_coverage = 92.0
rationale = "Banding-rule compaction decides which band a risk falls into before rating; duplicate-key/empty-key/value-shape guards must reject malformed band maps."

[[tool.haute.critical_coverage.files]]
path = "src/haute/deploy/_scorer.py"
min_statement_coverage = 97.0
min_branch_coverage = 87.0
rationale = "Deployed model scoring + runtime contract-drift detection; the dtype canonicalisation that feeds contract checks must not silently pass or mask drift."

[[tool.haute.critical_coverage.files]]
path = "src/haute/deploy/_batch_scoring.py"
min_statement_coverage = 91.0
min_branch_coverage = 86.0
rationale = "Deploy scoring: Multi-row deployed scoring returns every batch price. Seeded 2 points below the 24 September 2026 CI measurement."

[[tool.haute.critical_coverage.files]]
path = "src/haute/deploy/_model_code.py"
min_statement_coverage = 98.0
min_branch_coverage = 98.0
rationale = "Deploy scoring: The MLflow models-from-code entrypoint is what a deployed endpoint loads. Seeded 2 points below the 24 September 2026 CI measurement."

[[tool.haute.critical_coverage.files]]
path = "src/haute/deploy/_pruner.py"
min_statement_coverage = 91.0
min_branch_coverage = 87.0
rationale = "Deploy scoring: Pruning decides which nodes a deployed pipeline runs. Seeded 2 points below the 24 September 2026 CI measurement."

[[tool.haute.critical_coverage.files]]
path = "src/haute/deploy/_schema.py"
min_statement_coverage = 91.0
min_branch_coverage = 85.0
rationale = "Deploy scoring: The inferred input and output schemas validate every deployed request and response. Seeded 2 points below the 24 September 2026 CI measurement."

[[tool.haute.critical_coverage.files]]
path = "src/haute/_model_scorer.py"
min_statement_coverage = 97.0
min_branch_coverage = 95.0
rationale = "Model scoring is a shared pricing-path primitive."

[[tool.haute.critical_coverage.files]]
path = "src/haute/_output_assembler.py"
min_statement_coverage = 97.0
min_branch_coverage = 97.0
rationale = "Deploy scoring: The OUTPUT assembler builds the JSON document a deployed endpoint returns. Seeded 2 points below the 24 September 2026 CI measurement."

[[tool.haute.critical_coverage.files]]
path = "src/haute/_jsonpath.py"
min_statement_coverage = 98.0
min_branch_coverage = 94.0
rationale = "Deploy scoring: The path grammar maps every structured input and output field. Seeded 2 points below the 24 September 2026 CI measurement."

[[tool.haute.critical_coverage.files]]
path = "src/haute/modelling/_native_pyfunc.py"
min_statement_coverage = 93.0
min_branch_coverage = 64.0
rationale = "Deploy scoring: The MLflow pyfunc serves every native model Haute trains. Seeded 2 points below the 24 September 2026 CI measurement."

[[tool.haute.critical_coverage.files]]
path = "src/haute/modelling/_feature_contract.py"
min_statement_coverage = 92.0
min_branch_coverage = 85.0
rationale = "Feature contracts: The train-to-deploy feature contract fixes the columns, types and levels a model scores. Seeded 2 points below the 24 September 2026 CI measurement."

[[tool.haute.critical_coverage.files]]
path = "src/haute/modelling/_native_encoding.py"
min_statement_coverage = 92.0
min_branch_coverage = 89.0
rationale = "Feature contracts: Categorical encoding must match between training and scoring. Seeded 2 points below the 24 September 2026 CI measurement."

[[tool.haute.critical_coverage.files]]
path = "src/haute/modelling/_signature.py"
min_statement_coverage = 98.0
min_branch_coverage = 98.0
rationale = "Feature contracts: The MLflow signature is the logged model's input contract. Seeded 2 points below the 24 September 2026 CI measurement."

[[tool.haute.critical_coverage.files]]
path = "src/haute/_cache.py"
min_statement_coverage = 88.0
min_branch_coverage = 78.0
rationale = "Cache identity: Graph fingerprints decide when a cached result may be reused. Seeded 2 points below the 24 September 2026 CI measurement."

[[tool.haute.critical_coverage.files]]
path = "src/haute/_stat_gated_cache.py"
min_statement_coverage = 98.0
min_branch_coverage = 98.0
rationale = "Cache identity: Artifact reuse is gated on the backing file's freshness token. Seeded 2 points below the 24 September 2026 CI measurement."

[[tool.haute.critical_coverage.files]]
path = "src/haute/_hashing.py"
min_statement_coverage = 86.0
min_branch_coverage = 98.0
rationale = "Cache identity: Content hashes key cached artifacts and scoring models. Seeded 2 points below the 24 September 2026 CI measurement."

[[tool.haute.critical_coverage.files]]
path = "src/haute/_source_cache.py"
min_statement_coverage = 84.0
min_branch_coverage = 70.0
rationale = "Shared input generations own metadata, integrity, cross-process leases and publication; retains the former Explore-cache floor."

[[tool.haute.critical_coverage.files]]
path = "src/haute/_node_snapshots.py"
min_statement_coverage = 84.0
min_branch_coverage = 70.0
rationale = "Shared node generations replace the retired Explore cache's durable publication, retention and lease boundary; retains its floor."

[[tool.haute.critical_coverage.files]]
path = "src/haute/_file_lock.py"
min_statement_coverage = 90.0
min_branch_coverage = 85.0
rationale = "The one cross-process file-lock helper and its plain-path checks guard the project mutation lock, the input-snapshot store's lease and publication locks, and the runtime storage budget."

[[tool.haute.critical_coverage.files]]
path = "src/haute/_json_shred/_snapshots.py"
min_statement_coverage = 90.0
min_branch_coverage = 85.0
rationale = "Each API-input table's identity, freshness, one-shred build and supervised settlement decide what every structured source serves."

[[tool.haute.critical_coverage.files]]
path = "src/haute/_json_shred/_writer.py"
min_statement_coverage = 90.0
min_branch_coverage = 85.0
rationale = "Bounded Parquet emission is the memory boundary for table-snapshot builds and spills. (Split from the former single-module gate; same thresholds pending a remeasure.)"

[[tool.haute.critical_coverage.files]]
path = "src/haute/_json_shred/_shred.py"
min_statement_coverage = 90.0
min_branch_coverage = 85.0
rationale = "The single-pass v2 shred walk emits every cached pricing row. (Split from the former single-module gate; same thresholds pending a remeasure.)"

[[tool.haute.critical_coverage.files]]
path = "src/haute/_json_shred/_records.py"
min_statement_coverage = 90.0
min_branch_coverage = 85.0
rationale = "Streaming JSON/JSONL/XML record decoding bounds every structured-input read. (Split from the former single-module gate; same thresholds pending a remeasure.)"

[[tool.haute.critical_coverage.files]]
path = "src/haute/_json_shred/_runtime_storage.py"
min_statement_coverage = 90.0
min_branch_coverage = 85.0
