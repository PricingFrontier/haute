min_statement_coverage = 90.0
min_branch_coverage = 85.0
rationale = "The apiInput loader serves every structured source, from table snapshots or a standalone shred. (Split from the former single-module gate; same thresholds pending a remeasure.)"

[[tool.haute.critical_coverage.files]]
path = "src/haute/_json_shred/_source_proof.py"
min_statement_coverage = 90.0
min_branch_coverage = 85.0
rationale = "Source content proofs decide API-input table freshness. (Split from the former single-module gate; same thresholds pending a remeasure.)"

[[tool.haute.critical_coverage.files]]
path = "src/haute/_json_shred/_inference_cache.py"
min_statement_coverage = 98.0
min_branch_coverage = 98.0
